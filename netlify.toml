# Only dist/ is published: source, tests and docs are never served.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# `npm run dev` (netlify dev) runs Vite behind the Netlify proxy on :8888
[dev]
  framework = "#custom"
  command = "npx vite"
  targetPort = 5173
  port = 8888

# Pretty URLs
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
[[redirects]]
  from = "/signed-out"
  to = "/login.html"
  status = 200

# Baseline headers from docs/LwLAT-new-project-standards.md section 5. Keep the CSP strict: no inline scripts,
# no third-party script hosts. Document any exception in Admin → Security review. Never 'unsafe-eval'.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://login.microsoftonline.com"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Vite output: file names include a content hash, so they never change
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "private, max-age=31536000, immutable"
[[headers]]
  for = "/signin-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
